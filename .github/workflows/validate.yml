name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Validate Filumo workspace and documentation
        run: pnpm run check

      - name: Validate contracts
        run: pnpm test

      - name: Validate isolated consumers
        run: pnpm run test:consumers
        env:
          HUSKY: '0'

      - name: Validate npm and Yarn consumers
        run: pnpm run test:consumers:hosts
        env:
          HUSKY: '0'

      - name: Install browser for public Filumo regression
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate public Filumo browser fixtures
        run: pnpm run test:browser

      - name: Save public Filumo browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filumo-public-browser
          path: tmp/testing/public/
          if-no-files-found: ignore
          retention-days: 7
