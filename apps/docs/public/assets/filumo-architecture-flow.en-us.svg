<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Filumo 0.1.0 architecture</title>
  <desc id="desc">Framework adapters, shared DOM shell, Core protocol and nine lazy format plugins.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#172033}.heading{font-size:24px;font-weight:700}.package{font-size:19px;font-weight:650}.detail{font-size:16px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="980" fill="#f8fafc"/>
  <text x="40" y="56" font-size="30" font-weight="700">Filumo 0.1.0 architecture</text>
  <text x="40" y="90" class="detail">Adapters: mounting, events and lifecycle</text>
  <g fill="#eef2ff" stroke="#c7d2fe">
    <rect x="40" y="112" width="265" height="64" rx="12"/><rect x="325" y="112" width="265" height="64" rx="12"/><rect x="610" y="112" width="265" height="64" rx="12"/><rect x="895" y="112" width="265" height="64" rx="12"/>
  </g>
  <g class="package" text-anchor="middle"><text x="172" y="151">@filumo/react</text><text x="457" y="151">@filumo/vue</text><text x="742" y="151">@filumo/vue2</text><text x="1027" y="151">JavaScript</text></g>
  <path d="M172 176V194H600M457 176V194M742 176V194H600M1027 176V194H600M600 194V218" class="edge"/>
  <rect x="40" y="220" width="1120" height="92" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="60" y="257" class="heading">@filumo/dom · Shared DOM viewer shell</text>
  <text x="60" y="288" class="detail">Toolbar · Outline · Source views · Resizable splits · Style leases</text>
  <path d="M600 312V336" class="edge"/>
  <rect x="40" y="338" width="1120" height="92" rx="14" fill="#ecfeff" stroke="#67c5d4"/>
  <text x="60" y="375" class="heading">@filumo/core · Core source and session protocol</text>
  <text x="60" y="406" class="detail">File / Blob / URL / Uint8Array / DocumentSource · Detection · Cancellation · Limits</text>
  <path d="M600 430V450" class="edge"/>
  <text x="40" y="462" class="package">Nine format plugins: descriptors → lazy drivers and views</text>
  <g><rect x="40" y="480" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="514" class="package">@filumo/office</text><text x="60" y="546" class="detail">Word · Excel · PowerPoint</text></g>
<g><rect x="420" y="480" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="440" y="514" class="package">@filumo/pdf</text><text x="440" y="546" class="detail">Continuous pages · Canvas and text</text></g>
<g><rect x="800" y="480" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="820" y="514" class="package">@filumo/image</text><text x="820" y="546" class="detail">Native decoding · Shared interactions</text></g>
<g><rect x="40" y="592" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="626" class="package">@filumo/text</text><text x="60" y="658" class="detail">Encoding · Source · Readable fallback</text></g>
<g><rect x="420" y="592" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="440" y="626" class="package">@filumo/json</text><text x="440" y="658" class="detail">JSON · JSONC · JSONL / NDJSON</text></g>
<g><rect x="800" y="592" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="820" y="626" class="package">@filumo/markdown</text><text x="820" y="658" class="detail">Reading · Outline · Controlled HTML</text></g>
<g><rect x="40" y="704" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="738" class="package">@filumo/csv</text><text x="60" y="770" class="detail">CSV / TSV</text></g>
<g><rect x="420" y="704" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="440" y="738" class="package">@filumo/xml</text><text x="440" y="770" class="detail">Namespaces · Structure and source</text></g>
<g><rect x="800" y="704" width="360" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="820" y="738" class="package">@filumo/code</text><text x="820" y="770" class="detail">Language modules · Worker highlighting</text></g>
  <text x="40" y="846" class="detail">Core/text: decoding, line indexes and search. DOM: source, outline, split and highlights.</text>
  <rect x="40" y="874" width="1120" height="72" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="904" class="detail">@filumo/viewer: nine lightweight presets; dependencies installed, engines loaded on demand.</text>
  <text x="60" y="930" class="detail">Readonly · PDF needs matching assets · Format-specific Worker and cache policies</text>
</svg>
