<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Filumo vue2 示例</title>
    <link rel="stylesheet" href="../shared/demo.css" />
  </head>
  <body>
    <main class="demo-page">
      <header>
        <h1>Filumo vue2 示例</h1>
        <p>组件样式自动加载，文件仅在浏览器解析。</p>
        <label>选择文件 <input id="file" type="file" /></label>
        <p>
          <button id="docx">DOCX 示例</button>
          <button id="xlsx">XLSX 示例</button>
          <button id="pptx">PPTX 示例</button>
          <button id="svg">图片示例</button>
          <button id="pdf">PDF 示例</button>
          <button id="verify">运行基本验证</button>
        </p>
      </header>
      <p id="status" role="status">请选择文档</p>
      <div id="viewer"></div>
      <pre id="checks"></pre>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
